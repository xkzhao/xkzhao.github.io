<svg xmlns="http://www.w3.org/2000/svg" width="800" height="690" viewBox="0 0 800 690" role="img" aria-labelledby="title desc">
<title id="title">Three ways to split a model</title><desc id="desc">Tensor parallelism splits work within a layer. Pipeline parallelism splits consecutive layers. Expert parallelism distributes experts selected by a router.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50647c"/></marker></defs>
<rect width="800" height="690" rx="18" fill="#f8fafc"/>
<text x="32" y="44" fill="#172b4d" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start">One model. Three different cuts.</text>
<text x="32" y="75" fill="#50647c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Follow the numerical representation through the GPUs.</text>
<rect x="24" y="100" width="752" height="170" rx="10" fill="#fff" stroke="#d6dfeb" stroke-width="1.5"/>
<text x="44" y="133" fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">TP</text>
<text x="100" y="132" fill="#172b4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Split calculations within a layer</text>
<text x="44" y="194" fill="#172b4d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">input x</text>
<path d="M118 188 L145 188 L145 145 L460 145 L460 154" stroke="#50647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M145 188 L160 188" stroke="#50647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="170" y="154" width="180" height="65" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="370" y="154" width="180" height="65" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="260" y="181" fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">GPU 0</text>
<text x="260" y="206" fill="#172b4d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">tensor slice A</text>
<text x="460" y="181" fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">GPU 1</text>
<text x="460" y="206" fill="#172b4d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">tensor slice B</text>
<path d="M350 188 L360 188 L360 226 L580 226 L580 188" stroke="#50647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M550 188 L610 188" stroke="#50647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="628" y="184" fill="#172b4d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">pieces /</text>
<text x="628" y="209" fill="#172b4d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">contributions</text>
<text x="44" y="249" fill="#50647c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Same layer operation; devices compute different pieces.</text>
<rect x="24" y="285" width="752" height="170" rx="10" fill="#fff" stroke="#d6dfeb" stroke-width="1.5"/>
<text x="44" y="318" fill="#087f8c" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">PP</text>
<text x="100" y="317" fill="#172b4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Split consecutive layers into stages</text>
<rect x="44" y="338" width="210" height="65" rx="10" fill="#ecfeff" stroke="#087f8c" stroke-width="1.5"/>
<text x="149" y="365" fill="#087f8c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">GPU 0</text>
<text x="149" y="390" fill="#172b4d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">layers 1–20</text>
<path d="M260 371 L280 371" stroke="#50647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="286" y="338" width="210" height="65" rx="10" fill="#ecfeff" stroke="#087f8c" stroke-width="1.5"/>
<text x="391" y="365" fill="#087f8c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">GPU 1</text>
<text x="391" y="390" fill="#172b4d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">layers 21–40</text>
<path d="M502 371 L522 371" stroke="#50647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="528" y="338" width="210" height="65" rx="10" fill="#ecfeff" stroke="#087f8c" stroke-width="1.5"/>
<text x="633" y="365" fill="#087f8c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">GPU 2</text>
<text x="633" y="390" fill="#172b4d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">layers 41–60</text>
<text x="44" y="434" fill="#50647c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">One input visits each stage in order. Activations move forward.</text>
<rect x="24" y="470" width="752" height="170" rx="10" fill="#fff" stroke="#d6dfeb" stroke-width="1.5"/>
<text x="44" y="503" fill="#7c3aed" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">EP</text>
<text x="100" y="502" fill="#172b4d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Distribute experts in an MoE layer</text>
<text x="44" y="560" fill="#172b4d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">vector x</text>
<path d="M122 554 L156 554" stroke="#50647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="166" y="526" width="150" height="58" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="241" y="562" fill="#7c3aed" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">router</text>
<rect x="410" y="516" width="320" height="40" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="570" y="543" fill="#7c3aed" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">GPU 0 / E0</text>
<rect x="410" y="566" width="320" height="40" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="570" y="593" fill="#7c3aed" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">GPU 2 / E2</text>
<path d="M316 554 L360 554 L360 536 L400 536" stroke="#50647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M360 554 L360 586 L400 586" stroke="#50647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="44" y="628" fill="#50647c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Selected experts process x; their outputs are combined.</text>
</svg>
