<svg xmlns="http://www.w3.org/2000/svg" width="800" height="435" viewBox="0 0 800 435" role="img" aria-labelledby="title desc">
<title id="title">Pipeline schedule with three stages and four input groups</title><desc id="desc">Each stage takes 10 milliseconds. Input groups A, B, C, D enter on successive slots. A completes at 30 milliseconds and D completes at 60 milliseconds. Blank cells indicate idle stages.</desc>
