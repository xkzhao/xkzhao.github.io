<line x1="904" y1="229" x2="935" y2="229" stroke="#60a5fa" stroke-width="4"/><text x="946" y="234" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="15">4 sequences</text>
<line x1="904" y1="260" x2="935" y2="260" stroke="#fbbf24" stroke-width="4"/><text x="946" y="265" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="15">16 sequences</text>
<text x="883" y="321" fill="#fbbf24" font-family="Arial,sans-serif" font-size="15">16 × 8K = 40 GiB</text><text x="883" y="345" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Before allocator overhead</text></svg>
