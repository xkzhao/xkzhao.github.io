<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">GPU memory scopes</title><desc id="desc">Each SM has registers, shared memory and L1. L2 is shared across SMs, and global memory stores large tensors. The nesting shows scope rather than an access sequence.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#737373"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#242424"><text x="30" y="42" font-size="31" font-weight="700" fill="#242424" text-anchor="start">Where GPU data lives</text><rect x="30" y="72" width="840" height="483" rx="5" fill="white" stroke="#242424" stroke-width="2"/><text x="50" y="110" font-size="26" font-weight="700" fill="#242424" text-anchor="start">One GPU</text><rect x="55" y="135" width="375" height="228" rx="5" fill="#f7f7f7" stroke="#242424" stroke-width="2"/><text x="73" y="169" font-size="26" font-weight="700" fill="#242424" text-anchor="start">SM 1</text><rect x="71" y="190" width="343" height="44" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="84" y="220" font-size="24" font-weight="400" fill="#242424" text-anchor="start">Registers · per thread</text><rect x="71" y="246" width="343" height="44" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="84" y="276" font-size="24" font-weight="400" fill="#242424" text-anchor="start">Shared memory · per block</text><rect x="71" y="302" width="343" height="44" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="84" y="332" font-size="24" font-weight="400" fill="#242424" text-anchor="start">L1 cache · per SM</text><rect x="470" y="135" width="375" height="228" rx="5" fill="#f7f7f7" stroke="#242424" stroke-width="2"/><text x="488" y="169" font-size="26" font-weight="700" fill="#242424" text-anchor="start">SM 2 …</text><rect x="486" y="190" width="343" height="44" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="499" y="220" font-size="24" font-weight="400" fill="#242424" text-anchor="start">Registers · per thread</text><rect x="486" y="246" width="343" height="44" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="499" y="276" font-size="24" font-weight="400" fill="#242424" text-anchor="start">Shared memory · per block</text><rect x="486" y="302" width="343" height="44" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="499" y="332" font-size="24" font-weight="400" fill="#242424" text-anchor="start">L1 cache · per SM</text><rect x="55" y="386" width="790" height="61" rx="5" fill="#f7f7f7" stroke="#242424" stroke-width="2"/><text x="450" y="425" font-size="26" font-weight="400" fill="#242424" text-anchor="middle">L2 cache · shared across SMs</text><rect x="55" y="468" width="790" height="61" rx="5" fill="#f7f7f7" stroke="#c9c9c9" stroke-width="2"/><text x="450" y="507" font-size="26" font-weight="400" fill="#242424" text-anchor="middle">Global memory / HBM · large tensors</text><text x="30" y="581" font-size="22" font-weight="400" fill="#737373" text-anchor="start">Boxes show scope and placement, not a mandatory sequence of accesses.</text></g></svg>