<svg xmlns="http://www.w3.org/2000/svg" width="900" height="710" viewBox="0 0 900 710" role="img" aria-labelledby="title desc"><title id="title">Scheduling blocks onto SMs</title><desc id="desc">Nine blocks in a grid are shown above three SMs. Each SM has three resident blocks in one possible assignment; scheduling order is not guaranteed.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#737373"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#242424"><text x="30" y="42" font-size="31" font-weight="700" fill="#242424" text-anchor="start">Blocks are scheduled onto available SMs</text><text x="30" y="79" font-size="24" font-weight="400" fill="#737373" text-anchor="start">One possible assignment; block order is not guaranteed</text><rect x="150" y="112" width="600" height="202" rx="5" fill="#fafafa" stroke="#c9c9c9" stroke-width="2"/><text x="169" y="146" font-size="25" font-weight="700" fill="#242424" text-anchor="start">Grid</text><rect x="169" y="164" width="174" height="34" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="256" y="189" font-size="23" font-weight="400" fill="#242424" text-anchor="middle">Block 0</text><rect x="362" y="164" width="174" height="34" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="449" y="189" font-size="23" font-weight="400" fill="#242424" text-anchor="middle">Block 1</text><rect x="555" y="164" width="174" height="34" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="642" y="189" font-size="23" font-weight="400" fill="#242424" text-anchor="middle">Block 2</text><rect x="169" y="208" width="174" height="34" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="256" y="233" font-size="23" font-weight="400" fill="#242424" text-anchor="middle">Block 3</text><rect x="362" y="208" width="174" height="34" rx="5