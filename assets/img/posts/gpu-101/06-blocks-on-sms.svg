nt-weight="400" fill="#242424" text-anchor="middle">Block 4</text><path d="M450 350 V385" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="330" y="395" width="240" height="230" rx="5" fill="#fafafa" stroke="#242424" stroke-width="2"/><text x="350" y="430" font-size="26" font-weight="700" fill="#242424" text-anchor="start">SM 2</text><rect x="350" y="450" width="200" height="40" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="450" y="478" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">Block 3</text><rect x="350" y="502" width="200" height="40" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="450" y="530" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">Block 0</text><rect x="350" y="554" width="200" height="40" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="450" y="582" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">Block 8</text><path d="M740 350 V385" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="620" y="395" width="240" height="230" rx="5" fill="#fafafa" stroke="#242424" stroke-width="2"/><text x="640" y="430" font-size="26" font-weight="700" fill="#242424" text-anchor="start">SM 3</text><rect x="640" y="450" width="200" height="40" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="740" y="478" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">Block 6</text><rect x="640" y="502" width="200" height="40" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="740" y="530" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">Block 5</text><rect x="640" y="554" width="200" height="40" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="740" y="582" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">Block 2</text><text x="30" y="674" font-size="23" font-weight="400" fill="#737373" text-anchor="start">Res