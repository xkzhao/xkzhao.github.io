<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">SIMT and tile programming</title><desc id="desc">SIMT code assigns work to individual threads, which select data elements. Tile code expresses block-level operations, and the compiler assigns them to threads.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#737373"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#242424"><text x="30" y="42" font-size="31" font-weight="700" fill="#242424" text-anchor="start">Two ways to describe the same device work</text><path d="M450 95 V526" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="7 6"/><text x="30" y="112" font-size="28" font-weight="700" fill="#242424" text-anchor="start">SIMT model</text><text x="490" y="112" font-size="28" font-weight="700" fill="#242424" text-anchor="start">Tile model</text><rect x="30" y="139" width="380" height="77" rx="5" fill="#f7f7f7" stroke="#c9c9c9" stroke-width="2"/><text x="220" y="171" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">Kernel code</text><text x="220" y="201" font-size="24" font-weight="400" fill="#737373" text-anchor="middle">Per-thread logic</text><rect x="490" y="139" width="380" height="77" rx="5" fill="#f7f7f7" stroke="#c9c9c9" stroke-width="2"/><text x="680" y="171" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">Kernel code</text><text x="680" y="201" font-size="24" font-weight="400" fill="#737373" text-anchor="middle">Per-block operations</text><path d="M220 217 V252" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M680 217 V252" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="263" width="80" height="57" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="70" y="301" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">T0</text><path d="M70 328 V379" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="130" y="263" width="80" height="57" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="170" y="301" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">T1</text><path d="M170 328 V379" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="230" y="263" width="80" height="57" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="270" y="301" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">T2</text><path d="M270 328 V379" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="330" y="263" width="80" height="57" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="370" y="301" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">…</text><path d="M370 328 V379" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="490" y="263" width="380" height="57" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="680" y="301" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">Compiler maps work to threads</text><path d="M680 328 V379" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="390" width="380" height="92" rx="0" fill="#eeeeee" stroke="#c9c9c9" stroke-width="2"/><path d="M77.5 390 V482" stroke="#b3b3b3" stroke-width="1"/><path d="M125.0 390 V482" stroke="#b3b3b3" stroke-width="1"/><path d="M172.5 390 V482" stroke="#b3b3b3" stroke-width="1"/><path d="M220.0 390 V482" stroke="#b3b3b3" stroke-width="1"/><path d="M267.5 390 V482" stroke="#b3b3b3" stroke-width="1"/><path d="M315.0 390 V482" stroke="#b3b3b3" stroke-width="1"/><path d="M362.5 390 V482" stroke="#b3b3b3" stroke-width="1"/><rect x="490" y="390" width="380" height="92" rx="0" fill="#eeeeee" stroke="#c9c9c9" stroke-width="2"/><path d="M537.5 390 V482" stroke="#b3b3b3" stroke-width="1"/><path d="M585.0 390 V482" stroke="#b3b3b3" stroke-width="1"/><path d="M632.5 390 V482" stroke="#b3b3b3" stroke-width="1"/><path d="M680.0 390 V482" stroke="#b3b3b3" stroke-width="1"/><path d="M727.5 390 V482" stroke="#b3b3b3" stroke-width="1"/><path d="M775.0 390 V482" stroke="#b3b3b3" stroke-width="1"/><path d="M822.5 390 V482" stroke="#b3b3b3" stroke-width="1"/><path d="M490 413 H870" stroke="#b3b3b3" stroke-width="1"/><path d="M490 436 H870" stroke="#b3b3b3" stroke-width="1"/><path d="M490 459 H870" stroke="#b3b3b3" stroke-width="1"/><text x="220" y="517" font-size="23" font-weight="400" fill="#737373" text-anchor="middle">Threads select data elements</text><text x="680" y="517" font-size="23" font-weight="400" fill="#737373" text-anchor="middle">Block operates on a tile</text><text x="30" y="570" font-size="23" font-weight="400" fill="#737373" text-anchor="start">Both models use grids, blocks, SMs, and the same device memory.</text></g></svg>