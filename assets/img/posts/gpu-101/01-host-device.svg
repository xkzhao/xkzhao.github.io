<svg xmlns="http://www.w3.org/2000/svg" width="900" height="690" viewBox="0 0 900 690" role="img" aria-labelledby="title desc"><title id="title">CPU control and GPU execution</title><desc id="desc">The CPU prepares requests and launches work into a CUDA stream. GPU SMs execute kernels using resident HBM data; completion information returns to the host.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#737373"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#242424"><text x="30" y="42" font-size="31" font-weight="700" fill="#242424" text-anchor="start">CPU control and GPU execution</text><rect x="30" y="75" width="780" height="155" rx="5" fill="#f7f7f7" stroke="#c9c9c9" stroke-width="2"/><text x="48" y="108" font-size="25" font-weight="700" fill="#242424" text-anchor="start">CPU / host</text><rect x="50" y="130" width="170" height="64" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="135.0" y="171" font-size="25" font-weight="400" fill="#242424" text-anchor="middle">API</text><rect x="255" y="130" width="190" height="64" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="350.0" y="171" font-size="25" font-weight="400" fill="#242424" text-anchor="middle">Tokenizer</text><rect x="480" y="130" width="310" height="64" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="635.0" y="171" font-size="25" font-weight="400" fill="#242424" text-anchor="middle">Scheduler / runtime</text><path d="M220 162 H249" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M445 162 H474" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M635 230 V277" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><text x="400" y="260" font-size="23" font-weight="400" fill="#737373" text-anchor="start">Launch commands</text><rect x="380" y="285" width="430" height="65" rx="5" fill="#f7f7f7" stroke="#242424" stroke-width="2"/><text x="595" y="326" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">CUDA stream</text><text x="30" y="326" font-size="23" font-weight="400" fill="#737373" text-anchor="start">Ordered work queue</text><path d="M595 350 V383" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="390" width="780" height="255" rx="5" fill="#f7f7f7" stroke="#c9c9c9" stroke-width="2"/><text x="48" y="425" font-size="25" font-weight="700" fill="#242424" text-anchor="start">GPU / device</text><rect x="60" y="450" width="205" height="72" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="162.5" y="494" font-size="27" font-weight="700" fill="#242424" text-anchor="middle">SM 1</text><path d="M162.5 530 V558" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="315" y="450" width="205" height="72" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="417.5" y="494" font-size="27" font-weight="700" fill="#242424" text-anchor="middle">SM 2</text><path d="M417.5 530 V558" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="570" y="450" width="205" height="72" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="672.5" y="494" font-size="27" font-weight="700" fill="#242424" text-anchor="middle">SM …</text><path d="M672.5 530 V558" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="60" y="566" width="715" height="55" rx="5" fill="#f7f7f7" stroke="#242424" stroke-width="2"/><text x="417.5" y="602" font-size="26" font-weight="400" fill="#242424" text-anchor="middle">HBM: resident weights and tensors</text><path d="M810 476 H856 V165 H799" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="815" y="260" font-size="22" font-weight="400" fill="#737373" text-anchor="end">Results</text><text x="30" y="677" font-size="22" font-weight="400" fill="#737373" text-anchor="start">Solid: work or data access. Dashed: completion notification.</text></g></svg>