<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">CPU and GPU hardware organization</title><desc id="desc">A CPU and its system memory connect through PCIe or suitable NVLink platforms to a GPU. The GPU contains GPCs grouping SMs and its own HBM.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#737373"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#242424"><text x="30" y="42" font-size="31" font-weight="700" fill="#242424" text-anchor="start">CPU and GPU hardware organization</text><rect x="30" y="78" width="270" height="390" rx="5" fill="#fafafa" stroke="#242424" stroke-width="2"/><text x="50" y="116" font-size="28" font-weight="700" fill="#242424" text-anchor="start">CPU</text><rect x="50" y="155" width="100" height="64" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="100" y="196" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">Core</text><rect x="175" y="155" width="100" height="64" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="225" y="196" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">Core</text><rect x="50" y="242" width="100" height="64" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="100" y="283" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">Core</text><rect x="175" y="242" width="100" height="64" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="225" y="283" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">Core</text><rect x="50" y="356" width="230" height="74" rx="5" fill="#eeeeee" stroke="#c9c9c9" stroke-width="2"/><text x="165" y="400" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">System memory</text><path d="M165 310 V348" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M310 254 H426" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="368" y="210" font-size="23" font-weight="400" fill="#737373" text-anchor="middle">PCIe /</text><text x="368" y="239" font-size="23" font-weight="400" fill="#737373" text-anchor="middle">NVLink</text><rect x="438" y="78" width="532" height="390" rx="5" fill="#fafafa" stroke="#242424" stroke-width="2"/><text x="458" y="116" font-size="28" font-weight="700" fill="#242424" text-anchor="start">GPU</text><rect x="458" y="142" width="235" height="178" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="476" y="178" font-size="25" font-weight="700" fill="#242424" text-anchor="start">GPC 1</text><rect x="476" y="198" width="199" height="44" rx="5" fill="#eeeeee" stroke="#c9c9c9" stroke-width="2"/><text x="575.5" y="228" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">SM</text><rect x="476" y="258" width="199" height="44" rx="5" fill="#eeeeee" stroke="#c9c9c9" stroke-width="2"/><text x="575.5" y="288" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">SM</text><path d="M575.5 327 V351" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="713" y="142" width="235" height="178" rx="5" fill="white" stroke="#c9c9c9" stroke-width="2"/><text x="731" y="178" font-size="25" font-weight="700" fill="#242424" text-anchor="start">GPC 2 …</text><rect x="731" y="198" width="199" height="44" rx="5" fill="#eeeeee" stroke="#c9c9c9" stroke-width="2"/><text x="830.5" y="228" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">SM</text><rect x="731" y="258" width="199" height="44" rx="5" fill="#eeeeee" stroke="#c9c9c9" stroke-width="2"/><text x="830.5" y="288" font-size="24" font-weight="400" fill="#242424" text-anchor="middle">SM</text><path d="M830.5 327 V351" fill="none" stroke="#737373" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="458" y="356" width="491" height="74" rx="5" fill="#eeeeee" stroke="#c9c9c9" stroke-width="2"/><text x="703.5" y="400" font-size="25" font-weight="400" fill="#242424" text-anchor="middle">HBM / device memory</text><text x="30" y="511" font-size="24" font-weight="400" fill="#737373" text-anchor="start">GPCs group SMs. Each processor has directly attached memory.</text></g></svg>