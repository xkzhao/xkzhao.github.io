<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2370" viewBox="0 0 1600 2370" role="img" aria-labelledby="title desc"><title id="title">MoE layer: complete two-token routing walkthrough</title><desc id="desc">Five steps show contextual input vectors, learned scores, top-2 assignment metadata, local and remote expert batches on two GPUs, returned expert output vectors, and weighted combination back into each token. All numbers and routes are constructed.</desc><rect width="1600" height="2370" fill="#f5f8fc"/>
<text x="48" y="69" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#15263d">One MoE layer, from input vectors to combined results</text>
<text x="48" y="118" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#495f78">Two tokens | Four stored experts | Top-2 routing | Two GPU ranks</text>
<text x="48" y="158" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#495f78">Follow token A in blue and token B in orange. All scores and outputs are constructed.</text>
<rect x="40" y="190" width="1520" height="348" rx="16" fill="white" stroke="#bbcadb" stroke-width="2"/>
<rect x="65" y="210" width="48" height="48" rx="16" fill="#e4effa" stroke="#1268a6" stroke-width="2"/>
<text x="78" y="246" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#1268a6">1</text>
<text x="135" y="247" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#15263d">Input state and learned routing scores</text>
<text x="68" y="301" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#495f78">Attention has already built contextual vectors. Each layer makes its own routing decisions.</text>
<rect x="70" y="322" width="490" height="173" rx="16" fill="#edf5fc" stroke="#1268a6" stroke-width="2"/>
<text x="90" y="370" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1268a6">A: source GPU rank 0</text>
<text x="90" y="416" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#15263d">Input x_A = [1, 2]</text>
<text x="90" y="460" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#a44c00">B: source rank 1; x_B = [3, 1]</text>
<line x1="570" y1="402" x2="655" y2="402" stroke="#08785c" stroke-width="4"/>
<polygon points="655,402 639.6923992600045,409.3944140798909 639.6923992600045,394.6055859201091" fill="#08785c"/>
<text x="683" y="349" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#15263d">Scores</text>
<text x="955" y="350" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#15263d">E0</text>
<text x="1100" y="350" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#15263d">E1</text>
<text x="1245" y="350" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#15263d">E2</text>
<text x="1390" y="350" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#15263d">E3</text>
<text x="683" y="401" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1268a6">A</text>
<text x="955" y="400" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#1268a6">0.10</text>
<text x="1100" y="400" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#1268a6">0.05</text>
<text x="1245" y="400" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#1268a6">0.60</text>
<text x="1390" y="400" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#1268a6">0.25</text>
<text x="683" y="452" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#a44c00">B</text>
<text x="955" y="451" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#a44c00">0.50</text>
<text x="1100" y="451" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#a44c00">0.15</text>
<text x="1245" y="451" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#a44c00">0.05</text>
<text x="1390" y="451" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#a44c00">0.30</text>
<text x="685" y="504" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#08785c">A selects E2/E3; B selects E0/E3.</text>
<rect x="40" y="568" width="1520" height="354" rx="16" fill="white" stroke="#bbcadb" stroke-width="2"/>
<rect x="65" y="588" width="48" height="48" rx="16" fill="#e4effa" stroke="#1268a6" stroke-width="2"/>
<text x="78" y="624" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#1268a6">2</text>
<text x="135" y="625" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#15263d">Keep an assignment ledger</text>
<text x="68" y="679" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#495f78">Select top-2; renormalize the selected probabilities; retain token ID, expert ID and weight.</text>
<text x="80" y="722" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#15263d">Token</text>
<text x="245" y="722" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#15263d">Expert</text>
<text x="440" y="722" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#15263d">Combination weight</text>
<text x="885" y="722" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#15263d">Owner</text>
<text x="1210" y="722" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#15263d">Path</text>
<text x="80" y="769" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#1268a6">A</text>
<text x="245" y="769" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#1268a6">E2</text>
<text x="440" y="769" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#1268a6">0.60 / 0.85 = 0.706</text>
<text x="885" y="769" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#1268a6">rank 0</text>
<text x="1210" y="769" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#1268a6">local</text>
<text x="80" y="808" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#1268a6">A</text>
<text x="245" y="808" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#1268a6">E3</text>
<text x="440" y="808" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#1268a6">0.25 / 0.85 = 0.294</text>
<text x="885" y="808" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#1268a6">rank 1</text>
<text x="1210" y="808" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#1268a6">remote</text>
<text x="80" y="847" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#a44c00">B</text>
<text x="245" y="847" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#a44c00">E0</text>
<text x="440" y="847" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#a44c00">0.50 / 0.80 = 0.625</text>
<text x="885" y="847" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#a44c00">rank 0</text>
<text x="1210" y="847" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#a44c00">remote</text>
<text x="80" y="886" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#a44c00">B</text>
<text x="245" y="886" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#a44c00">E3</text>
<text x="440" y="886" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#a44c00">0.30 / 0.80 = 0.375</text>
<text x="885" y="886" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#a44c00">rank 1</text>
<text x="1210" y="886" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#a44c00">local</text>
<rect x="40" y="952" width="1520" height="495" rx="16" fill="white" stroke="#bbcadb" stroke-width="2"/>
<rect x="65" y="972" width="48" height="48" rx="16" fill="#e4effa" stroke="#1268a6" stroke-width="2"/>
<text x="78" y="1008" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#1268a6">3</text>
<text x="135" y="1009" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#15263d">Dispatch vectors; pack batches by expert</text>
<text x="68" y="1063" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#495f78">Assumed placement: rank 0 owns E0/E2; rank 1 owns E1/E3. A remains based on rank 0; B on rank 1.</text>
<rect x="75" y="1083" width="590" height="247" rx="16" fill="#edf5fc" stroke="#1268a6" stroke-width="2"/>
<rect x="935" y="1083" width="590" height="247" rx="16" fill="#fff3e8" stroke="#a44c00" stroke-width="2"/>
<text x="100" y="1132" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#1268a6">GPU rank 0</text>
<text x="960" y="1132" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#a44c00">GPU rank 1</text>
<text x="100" y="1184" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#a44c00">E0 batch: [B]   &lt;- remote x_B</text>
<text x="100" y="1233" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#1268a6">E2 batch: [A]   &lt;- local x_A</text>
<text x="100" y="1280" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#495f78">2 assignments across 2 experts</text>
<text x="960" y="1184" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#495f78">E1: no work in this batch</text>
<text x="960" y="1233" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#15263d">E3 batch: [A, B]</text>
<text x="960" y="1281" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#495f78">remote x_A + local x_B</text>
<line x1="665" y1="1158" x2="935" y2="1158" stroke="#1268a6" stroke-width="4"/>
<polygon points="935,1158 919.6923992600045,1165.394414079891 919.6923992600045,1150.605585920109" fill="#1268a6"/>
<text x="694" y="1138" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#1268a6">A -&gt; E3</text>
<line x1="935" y1="1270" x2="665" y2="1270" stroke="#a44c00" stroke-width="4"/>
<polygon points="665,1270 680.3076007399955,1262.605585920109 680.3076007399955,1277.394414079891" fill="#a44c00"/>
<text x="694" y="1318" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#a44c00">B -&gt; E0</text>
<text x="80" y="1378" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#495f78">All-to-all exchanges destination groups; it does not send every vector to every expert.</text>
<text x="80" y="1421" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#495f78">Every expert keeps its weights resident here, including idle E1. Batching reuses each expert’s weights.</text>
<rect x="40" y="1477" width="1520" height="339" rx="16" fill="white" stroke="#bbcadb" stroke-width="2"/>
<rect x="65" y="1497" width="48" height="48" rx="16" fill="#e4effa" stroke="#1268a6" stroke-width="2"/>
<text x="78" y="1533" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#1268a6">4</text>
<text x="135" y="1534" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#15263d">Run experts, then return results to source positions</text>
<text x="68" y="1588" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#495f78">Each expert is a different learned vector-to-vector function. Outputs below are made-up 2D excerpts.</text>
<text x="80" y="1636" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#15263d">Assignment</text>
<text x="305" y="1636" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#15263d">Expert output</text>
<text x="735" y="1636" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#15263d">Return destination</text>
<text x="1130" y="1636" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#15263d">Next action</text>
<text x="80" y="1685" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#1268a6">A -&gt; E2</text>
<text x="305" y="1685" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#1268a6">E2(x_A) = [2, 0]</text>
<text x="735" y="1685" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#1268a6">A on rank 0</text>
<text x="1130" y="1685" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#1268a6">local result</text>
<text x="80" y="1721" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#1268a6">A -&gt; E3</text>
<text x="305" y="1721" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#1268a6">E3(x_A) = [0, 4]</text>
<text x="735" y="1721" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#1268a6">A on rank 0</text>
<text x="1130" y="1721" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#1268a6">return from rank 1</text>
<text x="80" y="1757" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#a44c00">B -&gt; E0</text>
<text x="305" y="1757" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#a44c00">E0(x_B) = [4, 2]</text>
<text x="735" y="1757" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#a44c00">B on rank 1</text>
<text x="1130" y="1757" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#a44c00">return from rank 0</text>
<text x="80" y="1793" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#a44c00">B -&gt; E3</text>
<text x="305" y="1793" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#a44c00">E3(x_B) = [2, 6]</text>
<text x="735" y="1793" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#a44c00">B on rank 1</text>
<text x="1130" y="1793" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#a44c00">local result</text>
<rect x="40" y="1846" width="1520" height="349" rx="16" fill="white" stroke="#bbcadb" stroke-width="2"/>
<rect x="65" y="1866" width="48" height="48" rx="16" fill="#e4effa" stroke="#1268a6" stroke-width="2"/>
<text x="78" y="1902" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#1268a6">5</text>
<text x="135" y="1903" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#15263d">Restore token order and form one vector per token</text>
<text x="68" y="1957" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#495f78">The source combines expert outputs element by element. Both results continue to the next model operation.</text>
<text x="80" y="2011" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#1268a6">A: 0.706 * [2, 0] + 0.294 * [0, 4] = [1.412, 1.176]</text>
<text x="80" y="2071" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#a44c00">B: 0.625 * [4, 2] + 0.375 * [2, 6] = [3.250, 3.500]</text>
<text x="80" y="2138" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#08785c">One input position -&gt; two expert assignments -&gt; one combined output position.</text>
<text x="48" y="2263" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#15263d">What to remember</text>
<text x="48" y="2308" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#495f78">Routing chooses the function; placement chooses its GPU; packing chooses its execution batch.</text>
<text x="48" y="2347" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#495f78">This is one illustrated layer, not a latency benchmark or a claim that experts are topic specialists.</text>
</svg>